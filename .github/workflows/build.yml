name: Build and Release AMBAY Billing v2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          AMBAY_BASE_URL: ${{ vars.AMBAY_BASE_URL || 'https://ambay-registry.workers.dev' }}
          AMBAY_UPDATE_REPO: ${{ github.repository }}
          AMBAY_GOOGLE_WEB_CLIENT_ID: ${{ secrets.AMBAY_GOOGLE_WEB_CLIENT_ID || '' }}
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |What went wrong|Could not|Unresolved|error:" -A2 build.log | head -80 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $rc

      - name: Compute APK SHA-256
        id: hash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AMBAY Billing v1.0.${{ github.run_number }}
          body: |
            Automated release build #${{ github.run_number }} for **AMBAY MOBILE ACCESSORIES**.

            SHA-256: `${{ steps.hash.outputs.sha256 }}`
          files: ${{ steps.hash.outputs.apk }}
          draft: false
          prerelease: false
