name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --stacktrace > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Unresolved|wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $rc
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "AMBAY-Billing-$TAG.apk"
          gh release create "$TAG" "AMBAY-Billing-$TAG.apk" --title "AMBAY Billing $TAG" --notes "Auto build from ${{ github.sha }}"
