name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "AMBAY-Billing-$TAG.apk"
          gh release create "$TAG" "AMBAY-Billing-$TAG.apk" --title "AMBAY Billing $TAG" --notes "Auto build from ${{ github.sha }}"
